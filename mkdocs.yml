site_name: pyrrhotite
site_description: Automatic Schoenflies point group determination, character table generation, and 3-D molecule visualization
repo_url: https://github.com/Code-Tomas-Dadikozyan/pyrrhotite
repo_name: Code-Tomas-Dadikozyan/pyrrhotite
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Tomas Dadikozyan

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Code-Tomas-Dadikozyan/pyrrhotite
      name: Source code on GitHub
    - icon: fontawesome/solid/bug
      link: https://github.com/Code-Tomas-Dadikozyan/pyrrhotite/issues
      name: Report an issue
    - icon: fontawesome/solid/envelope
      link: mailto:tdadikozyan04@gmail.com
      name: Contact the maintainer

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide: user-guide.md
  - Algorithm & Supported Groups: algorithm.md
  - About: about.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.smartsymbols
