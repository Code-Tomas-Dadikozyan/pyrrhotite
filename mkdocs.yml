site_name: pyrrhotite
site_url: https://datomic117.github.io/pyrrhotite/
site_description: Automatic Schoenflies point group determination, character table generation, and 3-D molecule visualization
repo_url: https://github.com/datomic117/pyrrhotite
repo_name: datomic117/pyrrhotite
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Tomas Dadikozyan

# Snippet/include fragments live under docs/includes/ and are pulled into pages
# via pymdownx.snippets (e.g. auto_append); they are not standalone pages.
exclude_docs: |
  includes/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

plugins:
  # `search` is enabled by default, but listing `plugins:` disables that
  # default, so it must be named explicitly to keep search working.
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

extra_css:
  - stylesheets/extra.css

extra:
  # The header already links to the repo (via repo_url), so the footer only
  # adds the things that aren't reachable from there: filing an issue, and a
  # full contact page (rather than a bare mailto: link).
  social:
    - icon: fontawesome/solid/bug
      link: https://github.com/datomic117/pyrrhotite/issues
      name: Report an issue
    - icon: fontawesome/solid/envelope
      link: https://datomic117.github.io/pyrrhotite/about/#contact
      name: Contact the maintainer

nav:
  - Home: index.md
  - Guide:
      - Getting Started: getting-started.md
      - User Guide: user-guide.md
      - Examples Gallery: gallery.md
      - Example Script: example.md
  - Reference:
      - Algorithm & Supported Groups: algorithm.md
      - API Reference: api.md
      - Glossary: glossary.md
  - Project:
      - About: about.md
      - Changelog: changelog.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.smartsymbols
