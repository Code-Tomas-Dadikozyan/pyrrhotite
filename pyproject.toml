[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrrhotite"
version = "0.2.2"
readme = "README.md"
description = "Automatic Schoenflies point group determination from molecular coordinates and character table generation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]
vis = [
    "matplotlib",
    "PyOpenGL>=3.1",
    "PyQt6>=6.4",
    "pyrr>=0.10",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "black",  # used by mkdocstrings to format Python signatures in the API reference
]

[project.scripts]
pyrrhotite = "pyrrhotite.__main__:main"

[tool.setuptools]
packages = [
    "pyrrhotite",
    "pyrrhotite.character_tables",
    "pyrrhotite.operations",
    "pyrrhotite.point_groups",
    "pyrrhotite.visualizer",
    "pyrrhotite.visualizer.shaders",
    "pyrrhotite.visualizer.models",
]

[tool.setuptools.package-data]
"pyrrhotite" = ["sample_molecules/*.xyz"]
"pyrrhotite.visualizer" = ["assets/shaders/*.vs", "assets/shaders/*.fs", "assets/models/*.obj"]

[tool.setuptools.package-dir]
pyrrhotite = "src"