[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrrhotite"
version = "0.1.2"
readme = "README.md"
description = "Automatic Schoenflies point group determination from molecular coordinates and character table generation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]
vis = ["matplotlib"]

[project.scripts]
pyrrhotite = "pyrrhotite.__main__:main"

[tool.setuptools]
packages = ["pyrrhotite", "pyrrhotite.operations", "pyrrhotite.point_groups"]

[tool.setuptools.package-dir]
pyrrhotite = "src"