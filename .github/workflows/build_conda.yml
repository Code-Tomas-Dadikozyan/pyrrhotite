name: Build and publish Conda package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
    tags:
      - "v**"
  release:
    types:
      - published

jobs:
  check-version-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check version strings
        run: python testversion.py

  build-anaconda:
    needs: [check-version-strings]
    runs-on: ubuntu-latest
    container: conda/miniconda3
    steps:
      - uses: actions/checkout@v4
      - name: Install conda-build tools
        run: conda install -y conda-build anaconda-client
      - name: Build Conda package
        run: conda build .
      - name: Collect built package
        run: |
          mkdir -p /tmp/conda-pkg
          cp $(conda build . --output) /tmp/conda-pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: conda-package
          path: /tmp/conda-pkg/*.tar.bz2

  publish-anaconda:
    needs: [build-anaconda]
    runs-on: ubuntu-latest
    container: conda/miniconda3
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: anaconda
      url: https://anaconda.org/your-username/schoenflies
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: conda-package
          path: /tmp/conda-pkg
      - name: Install anaconda-client
        run: conda install -y anaconda-client
      - name: Upload to Anaconda Cloud
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: anaconda upload /tmp/conda-pkg/*.tar.bz2
