<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="pyrrhotite logo">
  <defs>
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0cf8a"/>
      <stop offset="100%" stop-color="#caa14f"/>
    </linearGradient>
    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfa452"/>
      <stop offset="100%" stop-color="#a47a30"/>
    </linearGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a7434"/>
      <stop offset="100%" stop-color="#785a26"/>
    </linearGradient>
  </defs>

  <g stroke="#1b2733" stroke-width="1.4" stroke-linejoin="round">
    <!-- Left crystal -->
    <polygon points="16,18 24,30 24,52 8,52 8,30" fill="url(#facetMid)"/>
    <polygon points="16,18 24,30 16,30" fill="url(#facetLight)"/>

    <!-- Right crystal -->
    <polygon points="48,16 58,28 58,50 40,50 40,28" fill="url(#facetDark)"/>
    <polygon points="48,16 58,28 48,28" fill="url(#facetMid)"/>

    <!-- Center crystal (front) -->
    <polygon points="32,6 44,22 44,58 20,58 20,22" fill="url(#facetMid)"/>
    <polygon points="32,6 44,22 32,22" fill="url(#facetLight)"/>
    <polygon points="32,22 44,22 44,58 32,58" fill="url(#facetDark)"/>
    <polygon points="32,22 32,58 20,58 20,22" fill="url(#facetMid)"/>
  </g>
</svg>
