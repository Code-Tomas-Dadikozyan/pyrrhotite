package:
  name: schoenflies
  version: "0.1.0"

source:
  path: .

build:
  script: "{{ PYTHON }} -m pip install . -vv"
  number: 0

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
    - numpy
    - scipy
  run:
    - python >=3.10
    - numpy
    - scipy

test:
  requires:
    - pytest
  commands:
    - pytest tests/

about:
  home: https://github.com/Code-Tomas-Dadikozyan/schoenflies_python
  license: GPL-3.0-or-later
  summary: Automatic Schoenflies point group determination from molecular coordinates
  description: |
    A Python package for determining the Schoenflies point group symbol
    from molecular coordinates. Translated from the reference C++ implementation.
